services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    env_file: [.env]
    environment: {MONGO_URL: "mongodb://mongo:27017", REDIS_URL: "redis://redis:6379/0"}
    ports: ["8000:8000"]
    depends_on: [mongo, redis]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment: {MONGO_URL: "mongodb://mongo:27017", REDIS_URL: "redis://redis:6379/0"}
    depends_on: [mongo, redis]
